# nginx de producción para despliegue con túneles Cloudflare.
#
# Cloudflare termina TLS hacia el usuario y habla HTTP con este nginx a través
# del túnel (cloudflared -> http://localhost:80). Por eso aquí NO hay SSL ni
# Let's Encrypt: el túnel mantiene el host original en la cabecera Host y este
# nginx enruta por server_name.
#
# Cada frontend ya es un contenedor nginx que sirve su SPA y hace proxy de
# /api y /uploads hacia backend:3001 (con sus propios headers de seguridad y
# CSP). Aquí solo se reparte el tráfico por subdominio.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    client_max_body_size 10m;

    # DNS interno de Docker con re-resolución: si un contenedor se recrea,
    # nginx no conserva la IP vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cliente (app.domipalermo.com)
    server {
        listen 80;
        server_name app.domipalermo.com;
        set $upstream http://frontend:80;

        location / {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Comercio (comercio.domipalermo.com)
    server {
        listen 80;
        server_name comercio.domipalermo.com;
        set $upstream http://comercio:80;

        location / {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Admin (admin.domipalermo.com)
    server {
        listen 80;
        server_name admin.domipalermo.com;
        set $upstream http://admin:80;

        location / {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Domiciliario (domiciliario.domipalermo.com)
    server {
        listen 80;
        server_name domiciliario.domipalermo.com;
        set $upstream http://domiciliario:80;

        location / {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Cualquier otro host
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
