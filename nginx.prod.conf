# Configuración nginx para producción
# Sirve frontends estáticos + proxy API + SSL termination

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Tamaño máximo de body (subida de imágenes/banners)
    client_max_body_size 10m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Backend con re-resolución de DNS: si el contenedor backend se recrea,
    # nginx no conserva la IP vieja (evita 502 hasta recargar nginx).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend principal (cliente)
    server {
        listen 80;
        server_name tudominio.com www.tudominio.com;
        
        # ACME challenge para Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect HTTP -> HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS - Frontend principal
    server {
        listen 443 ssl http2;
        server_name tudominio.com www.tudominio.com;
        root /usr/share/nginx/html/frontend;
        index index.html;
        set $backend http://backend:3001;

        ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers: se declaran dentro de location / (ver abajo).
        # Un add_header en una location anula la herencia de nivel server, y en
        # /api/ y /uploads/ el backend (helmet) ya envía los suyos.

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.google.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.web.app https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';             upgrade-insecure-requests;" always;
        }

        # Sin caché para HTML, manifest y service worker (evita HTML obsoleto tras un deploy)
        location ~* \.(?:html|webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.google.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.web.app https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.google.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.web.app https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
        }

        # Imágenes subidas (fallback local, servidas por el backend)
        location /uploads/ {
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        # Proxy API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Auth endpoints - stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

