services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_ENGINE=mysql
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=domicilios_palermo
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=https://app.domipalermo.com,https://comercio.domipalermo.com,https://admin.domipalermo.com,https://domiciliario.domipalermo.com
      - CLIENT_URL=${CLIENT_URL}
      - COMERCIO_URL=${COMERCIO_URL}
      - DOMICILIARIO_URL=${DOMICILIARIO_URL}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES}
      - TURNSTILE_EXCLUDED_ORIGINS=${TURNSTILE_EXCLUDED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER}
      - AI_FALLBACK_ORDER=${AI_FALLBACK_ORDER}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - PAYMENT_LINK_BASE_URL=${PAYMENT_LINK_BASE_URL}
      - WOMPI_ENV=${WOMPI_ENV}
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
      - WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - domicilios-network

  mysql:
    image: mysql:8
    command: --lower-case-table-names=1
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=domicilios_palermo
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domicilios-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # Puertos de compatibilidad con la config actual del túnel Cloudflare
      # (mientras se reapunta a :80). nginx enruta por server_name/Host.
      - "5173:80"
      - "5174:80"
      - "5175:80"
      - "5176:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - comercio
      - admin
      - domiciliario
    restart: unless-stopped
    networks:
      - domicilios-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - domicilios-network

  comercio:
    build:
      context: ./comercio
      dockerfile: Dockerfile
    networks:
      - domicilios-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    networks:
      - domicilios-network

  domiciliario:
    build:
      context: ./domiciliario
      dockerfile: Dockerfile
    networks:
      - domicilios-network

networks:
  domicilios-network:
    driver: bridge

volumes:
  mysql_data: