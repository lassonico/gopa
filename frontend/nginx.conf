server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # DNS de Docker con re-resolución (el backend puede cambiar de IP al recrearse)
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3001;

    # SPA fallback - sirve index.html para rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.google.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    # Sin caché para HTML, manifest y service worker (PWA se actualiza siempre)
    # Ojo: un add_header dentro de una location anula la herencia de nivel server,
    # por eso los headers de seguridad se repiten aquí explícitamente.
    location ~* \.(?:html|webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://accounts.google.com https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://www.openstreetmap.org; frame-src 'self' https://accounts.google.com https://maps.google.com https://www.google.com https://*.google.com https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.recaptcha.net https://recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    # Proxy API al backend (los headers de seguridad los pone el backend: helmet)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas (fallback local, servidas por el backend)
    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
