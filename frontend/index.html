    #dp-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffffff; font-family: 'Poppins', system-ui, sans-serif; }
    #dp-boot img { width: 60px; height: 60px; border-radius: 16px; box-shadow: 0 6px 20px rgba(94, 36, 78, 0.18); animation: dp-pulse 1.6s ease-in-out infinite; }
    #dp-boot .dp-ring { width: 34px; height: 34px; border: 3px solid #f3e9ef; border-top-color: #5E244E; border-radius: 50%; animation: dp-spin 0.8s linear infinite; }
    #dp-boot span { color: #9ca3af; font-size: 13px; letter-spacing: 0.02em; }
    @keyframes dp-spin { to { transform: rotate(360deg); } }
    @keyframes dp-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
